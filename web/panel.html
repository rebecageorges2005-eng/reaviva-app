<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Reaviva</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--sand:#faf6f1;--sand-2:#f3ece3;--rose:#f6e3da;--terra:#c4704f;--terra-dark:#a5583a;--cocoa:#4a3728;--cocoa-soft:#7a6252}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sand);color:var(--cocoa);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.top{position:sticky;top:0;z-index:10;background:rgba(250,246,241,.96);border-bottom:1px solid #eadfd3;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{font-size:1.2rem;font-weight:800;text-decoration:none;color:var(--cocoa)}
.logo span{color:var(--terra)}
.top .spacer{flex:1}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:.9rem;font-weight:700;cursor:pointer;background:var(--terra);color:#fff}
.btn:active{transform:scale(.98)}
.btn-ghost{background:transparent;color:var(--cocoa-soft);border:1px solid #ddd}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.btn-danger{background:#b0523c}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
h2.sec{margin:26px 0 12px;font-size:1.15rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(74,55,40,.07)}
.card b{display:block;font-size:1.6rem;color:var(--terra-dark)}
.card span{font-size:.82rem;color:var(--cocoa-soft)}
.field{width:100%;border:1px solid #e2d5c5;border-radius:12px;padding:11px 14px;font-size:.95rem;margin-bottom:10px;background:#fff;color:var(--cocoa)}
.field:focus{outline:2px solid var(--terra)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(74,55,40,.07);font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--sand-2)}
th{background:var(--sand-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:var(--cocoa-soft)}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--sand)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.badge.ok{background:#e3f2e5;color:#2e7d32}
.badge.warn{background:#fdeeda;color:#b26a00}
.badge.info{background:#e3ecf7;color:#2456a6}
.badge.muted{background:#eee;color:#888}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ccc;margin-right:6px}
.dot.on{background:#37b24d}
.block{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(74,55,40,.07);margin-bottom:16px}
.detail{border-left:4px solid var(--terra)}
.msg{border-left:4px solid var(--terra)}
.msg .m-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.msg b{font-size:.95rem}
.msg small{color:var(--cocoa-soft)}
.msg p{font-size:.9rem;white-space:pre-wrap}
.cmt{border-left:4px solid var(--rose);margin-bottom:12px;animation:cmtIn .3s ease both}
.cmt.hidden-c{opacity:.55;border-left-color:#ccc}
@keyframes cmtIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Lista de comunidad con scroll propio (no empuja toda la página) */
.community-scroll{max-height:480px;overflow-y:auto;overscroll-behavior:contain;padding:4px 6px 4px 2px;border:1px solid var(--hatch-widget-border,#eee);border-radius:12px;background:rgba(255,255,255,.35)}
.community-scroll::-webkit-scrollbar{width:8px}
.community-scroll::-webkit-scrollbar-thumb{background:#d8c9b8;border-radius:4px}
.community-scroll::-webkit-scrollbar-track{background:transparent}
@media (max-width:640px){.community-scroll{max-height:60vh}}
/* Scroll propio para CADA sección del panel */
.scroll-box{max-height:340px;overflow-y:auto;overscroll-behavior:contain;padding:6px;border:1px solid var(--hatch-widget-border,#e8ded2);border-radius:12px;background:rgba(255,255,255,.35);scrollbar-width:thin}
.scroll-box::-webkit-scrollbar{width:8px}
.scroll-box::-webkit-scrollbar-thumb{background:#d8c9b8;border-radius:4px}
.scroll-box::-webkit-scrollbar-track{background:transparent}
.scroll-box.tall{max-height:340px}
.scroll-box.small{max-height:230px}
.scroll-box table{width:100%}
.scroll-box thead th{position:sticky;top:0;background:#fff;z-index:1}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px;animation:livePulse 1.6s infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}
.cmt .who{font-size:.8rem;color:var(--cocoa-soft);margin-bottom:4px}
.cmt .actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;background:#fff;border-radius:14px;padding:14px 12px 8px;box-shadow:0 2px 10px rgba(74,55,40,.07);margin-bottom:12px;overflow-x:auto}
.bar{flex:1;min-width:8px;background:var(--rose);border-radius:4px 4px 0 0;position:relative}
.bar.plan{background:var(--terra)}
.bar:hover::after{content:attr(data-tip);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--cocoa);color:#fff;font-size:.7rem;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5}
.center{text-align:center;padding:60px 20px;color:var(--cocoa-soft)}
.center a{color:var(--terra-dark)}
.err{background:#fde8e4;color:#a33;border-radius:12px;padding:12px 16px;margin:12px 0;font-size:.9rem}
.okmsg{background:#e3f2e5;color:#2e7d32;border-radius:12px;padding:12px 16px;margin:12px 0;font-size:.9rem}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{width:auto;margin-bottom:0}
/* ---------- modal de detalle de usuario ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(74,55,40,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:var(--sand);border-radius:18px;max-width:720px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.25);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--sand-2)}
.modal-head .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--rose);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;overflow:hidden}
.modal-head .avatar img{width:100%;height:100%;object-fit:cover}
.modal-head .who{flex:1;min-width:0}
.modal-head .who b{font-size:1.05rem;display:block}
.modal-head .who small{color:var(--cocoa-soft)}
.modal-tabs{display:flex;gap:4px;padding:10px 16px 0;background:#fff;border-bottom:1px solid var(--sand-2);overflow-x:auto}
.modal-tab{border:none;background:none;padding:10px 14px;font-size:.85rem;font-weight:700;color:var(--cocoa-soft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.modal-tab.active{color:var(--terra-dark);border-bottom-color:var(--terra)}
.modal-body{padding:18px 20px;max-height:60vh;overflow-y:auto}
.modal-body h4{margin:0 0 8px;font-size:.95rem}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;background:#fff;border-top:1px solid var(--sand-2)}
.kv{font-size:.9rem;margin:5px 0}
.kv b{color:var(--cocoa)}
.kv .val{color:var(--cocoa-soft)}
.card.clickable{cursor:pointer;transition:transform .12s}
.card.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(74,55,40,.14)}
.rowline{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--sand-2);font-size:.88rem}
.rowline:last-child{border-bottom:none}
.progbar{height:14px;background:#eee;border-radius:999px;overflow:hidden;margin:8px 0}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--terra-dark));border-radius:999px}
.daygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.daycell{background:#fff;border:1px solid #e8ddd0;border-radius:8px;text-align:center;font-size:.75rem;padding:6px 0;color:#bbb}
.daycell.done{background:#e3f2e5;border-color:#a5d6a7;color:#2e7d32;font-weight:700}
.jentry{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.85rem}
.jentry .jd{font-size:.75rem;color:var(--cocoa-soft);margin-bottom:4px}
.cmsg{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.85rem}
.cmsg .cd{font-size:.75rem;color:var(--cocoa-soft);margin-bottom:4px}
.chathist{display:flex;gap:8px;align-items:flex-end;height:90px;margin:10px 0}
.chatbar{flex:1;background:var(--rose);border-radius:6px 6px 0 0;min-height:6px;position:relative}
.chatbar:hover::after{content:attr(data-tip);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--cocoa);color:#fff;font-size:.7rem;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5}
.pmsg{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.85rem;border-left:4px solid var(--terra)}
.pmsg .pd{font-size:.75rem;color:var(--cocoa-soft);margin-bottom:4px}
@media(max-width:600px){th,td{padding:8px 8px;font-size:.8rem}.cards{grid-template-columns:repeat(2,1fr)}.daygrid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/">Reaviva<span>.</span></a>
  <span style="font-size:.85rem;color:var(--cocoa-soft)">👑 Panel de administrador</span>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm" onclick="refreshAll()" title="Recargar todos los datos">🔄 Actualizar</button>
  <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
</div>
<div class="wrap" id="app"><p class="center">Cargando…</p></div>

<script>
"use strict";
/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function token(){ try{ return JSON.parse(localStorage.getItem("reaviva_token")||"null"); }catch(e){ return null; } }
function isAdmin(){ try{ return JSON.parse(localStorage.getItem("reaviva_admin")||"false")===true; }catch(e){ return false; } }
function headers(){ var t=token(); return t?{"Authorization":"Bearer "+t,"Content-Type":"application/json"}:{"Content-Type":"application/json"}; }
function logout(){ localStorage.removeItem("reaviva_user"); localStorage.removeItem("reaviva_token"); localStorage.removeItem("reaviva_admin"); localStorage.removeItem("reaviva_paid"); location.href="/"; }
/* Recarga todas las secciones sin recargar la página. */
async function refreshAll(){
  var btn = event && event.target ? event.target : null;
  var old = btn ? btn.textContent : null;
  if(btn){ btn.textContent = "⏳ Actualizando…"; btn.disabled = true; }
  try{ await render(); }catch(e){}
  if(btn){ btn.textContent = old; btn.disabled = false; }
}

/* ---------- 📋 Reportes de Muse ---------- */
async function loadMuseReports(){
  var box = $("#muse-reports");
  if(!box) return;
  try{
    var r = await api("GET", "/api/admin/reports");
    var badge = $("#reports-badge");
    if(badge) badge.innerHTML = r.unread > 0 ? '<span style="background:#c0392b;color:#fff;border-radius:12px;padding:2px 10px;font-size:.8rem">'+r.unread+' nuevos</span>' : '';
    if(!r.reports.length){
      box.innerHTML = '<p style="color:var(--cocoa-soft);text-align:center">Aún no hay reportes. Muse los publicará aquí.</p>';
      return;
    }
    box.innerHTML = r.reports.map(function(rep){
      var isNew = !rep.is_read;
      var userTag = rep.user_name ? ' <span style="background:var(--terra);color:#fff;border-radius:10px;padding:2px 8px;font-size:.75rem">👤 '+esc(rep.user_name)+'</span>' : '';
      return '<div class="block" style="'+(isNew?'border-left:4px solid #c0392b;':'')+'margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">'+
          '<b>'+esc(rep.title)+'</b>'+userTag+
          (isNew?'<button class="btn btn-sm" onclick="markReportRead('+rep.id+')">Marcar leído</button>':'<span style="color:var(--cocoa-soft);font-size:.75rem">✓ leído</span>')+
        '</div>'+
        '<div style="font-size:.85rem;color:var(--cocoa-soft);margin:4px 0">'+esc(rep.created_at||'')+'</div>'+
        '<div style="white-space:pre-wrap;font-size:.9rem;margin-top:6px">'+esc(rep.content)+'</div>'+
      '</div>';
    }).join("");
  }catch(e){
    box.innerHTML = '<p style="color:#a33">Error cargando reportes</p>';
  }
}
async function markReportRead(id){
  try{ await api("POST", "/api/admin/reports/"+id+"/read"); loadMuseReports(); }catch(e){}
}

async function api(method, path, body){
  var opts={method:method,headers:headers()};
  if(body) opts.body=JSON.stringify(body);
  var r=await fetch(path,opts);
  if(r.status===401||r.status===403) throw new Error("AUTH");
  if(!r.ok){ var t=""; try{ t=await r.text(); }catch(e){} throw new Error("HTTP "+r.status+" "+t.slice(0,120)); }
  return r.json();
}
function authFail(){
  $("#app").innerHTML='<div class="center"><h2>Sesión expirada 🔒</h2><p>Vuelve a entrar como administrador.</p><p style="margin-top:16px"><a class="btn" href="/admin/ingzoe" style="text-decoration:none">Ir al acceso admin</a></p></div>';
}

/* ---------- modal genérico de detalle / confirmación ----------
 * Toda opción clicable del panel abre una ventana con detalles.
 * showDetailModal(titulo, cuerpoHtml, botones)
 *   botones: [{label, cls, onClick}] — cls opcional ("btn-danger", "btn-ghost") */
function showDetailModal(title, bodyHtml, buttons){
  closeDetailModal();
  var btnHtml=(buttons||[]).map(function(b,i){
    return '<button class="btn btn-sm '+(b.cls||"")+'" data-act="'+i+'">'+esc(b.label)+'</button>';
  }).join("");
  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeDetailModal()">'+
    '<div class="modal" style="max-width:560px">'+
    '<div class="modal-head" style="padding:14px 18px"><div class="who"><b style="font-size:1rem">'+esc(title)+'</b></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="closeDetailModal()">✕</button></div>'+
    '<div class="modal-body">'+bodyHtml+'</div>'+
    (btnHtml?'<div class="modal-foot">'+btnHtml+'</div>':'')+
    '</div></div>');
  Array.prototype.forEach.call(document.querySelectorAll("#detail-modal [data-act]"), function(el){
    el.addEventListener("click", function(){ buttons[Number(el.getAttribute("data-act"))].onClick(); });
  });
}
function closeDetailModal(){ var m=$("#detail-modal"); if(m) m.remove(); }
/* Fila clave/valor para los detalles. value ya viene escapado o es HTML seguro. */
function kv(label, value){ return '<p class="kv"><b>'+esc(label)+':</b> <span class="val">'+value+'</span></p>'; }
function kvRaw(label, html){ return '<p class="kv"><b>'+esc(label)+':</b> '+html+'</p>'; }
/* Botón Cancelar estándar para los modales de confirmación. */
function cancelBtn(){ return {label:"Cancelar", cls:"btn-ghost", onClick:closeDetailModal}; }

/* ---------- boot ---------- */
/* Bandera emoji desde código ISO (ej. "BO" → 🇧🇴). */
function flagEmoji(code){
  if(!code||code.length!==2) return "";
  try{
    return String(code).toUpperCase().split("").map(function(c){
      return String.fromCodePoint(127397+c.charCodeAt(0));
    }).join("");
  }catch(e){ return ""; }
}
function paisCell(u){
  if(u.pais) return flagEmoji(u.codigoPais)+" "+esc(u.pais);
  return '<span style="color:#bbb">—</span>';
}
document.addEventListener("DOMContentLoaded", function(){
  if(!isAdmin()||!token()){
    $("#app").innerHTML='<div class="center"><h2>Acceso denegado 🔒</h2><p>Esta página es solo para administradores.</p><p style="margin-top:16px"><a class="btn" href="/admin/ingzoe" style="text-decoration:none">Ir al acceso admin</a></p></div>';
    return;
  }
  render();
});

async function render(){
  try{
    var s=await api("GET","/api/admin/stats");
    statsCache=s;
    $("#app").innerHTML=
      '<h2 class="sec">📊 Estadísticas</h2>'+
      '<h2 class="sec">📋 Reportes de Muse <span id="reports-badge"></span></h2>'+
      '<div class="block"><div id="muse-reports" class="scroll-box"><p style="color:var(--cocoa-soft)">Cargando reportes…</p></div></div>'+
      '<div class="cards">'+
      '<div class="card clickable" onclick="showCardDetail(\'total\')" title="Ver detalles"><b>'+s.totalUsers+'</b><span>👥 Usuarios registrados</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'plan\')" title="Ver detalles"><b>'+s.subscribedUsers+'</b><span>💳 Con plan pagado</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'trial\')" title="Ver detalles"><b>'+s.trialUsers+'</b><span>🆓 En prueba / sin plan</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'online\')" title="Ver detalles"><b>'+s.onlineNow+'</b><span>🟢 Conectados ahora</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'today\')" title="Ver detalles"><b>'+s.signupsToday+'</b><span>📝 Registros hoy</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'mrr\')" title="Ver detalles"><b>$'+(s.mrr||0)+'</b><span>💰 MRR estimado</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'countries\')" title="Ver detalles"><b>'+(s.countriesCount||0)+'</b><span>🌍 Países</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'chat\')" title="Ver detalles"><b>'+(s.mutedChats||0)+'</b><span>🚩 Chats deshabilitados</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'flag\')" title="Ver detalles"><b>'+(s.flaggedUsers||0)+'</b><span>🚩 Con banderas'+(s.redFlags?' ('+s.redFlags+' 🔴)':'')+'</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'cancel\')" title="Ver detalles"><b>'+(s.cancelledPlans||0)+'</b><span>❌ Planes cancelados</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'rvcirc\')" title="Ver detalles"><b>'+(s.rvCirculacion||0)+'</b><span>💰 RV en circulación</span></div>'+
      '<div class="card clickable" onclick="showCardDetail(\'rving\')" title="Ver detalles"><b>$'+(s.ingresosRV||0)+'</b><span>🛒 Ingresos por RV</span></div>'+
      (s.referredUsers?'<div class="card clickable" onclick="showCardDetail(\'referrals\')" title="Ver detalles"><b>'+s.referredUsers+'</b><span>📤 Llegaron por referido</span></div>':'')+
      '</div>'+
      (s.topCountries&&s.topCountries.length?
        '<h2 class="sec">🌍 Top países</h2><div class="block">'+
        s.topCountries.map(function(c,i){
          return '<p style="font-size:.9rem;padding:4px 0">'+(i+1)+'. '+flagEmoji(c.codigo)+' <b>'+esc(c.pais)+'</b> — '+c.usuarios+' usuario'+(c.usuarios===1?'':'s')+'</p>';
        }).join("")+'</div>':'')+
      '<h2 class="sec">📈 Crecimiento</h2>'+
      '<div class="toolbar"><select id="growth-days" class="field" onchange="loadGrowth()">'+
      '<option value="8">Últimos 8 días</option><option value="15">Últimos 15 días</option>'+
      '<option value="30" selected>Últimos 30 días</option><option value="60">Últimos 60 días</option>'+
      '<option value="90">Últimos 90 días</option><option value="180">Últimos 6 meses</option>'+
      '<option value="365">Último año</option></select> '+
      '<select id="growth-view" class="field" onchange="loadGrowth()">'+
      '<option value="fecha">📅 Por fecha</option><option value="pais">🌍 Por país</option><option value="ciudad">🏙️ Por ciudad</option></select></div>'+
      '<div id="growth-chart" class="chart"></div>'+
      '<div class="scroll-box small"><table><thead><tr id="growth-head"><th>Período</th><th>Nuevos usuarios</th><th>Nuevos con plan</th></tr></thead><tbody id="growth-body"><tr><td colspan="3">Cargando…</td></tr></tbody></table></div>'+
      '<h2 class="sec">👥 Usuarios</h2>'+
      '<div class="toolbar"><input id="user-search" class="field" placeholder="🔍 Buscar por nombre, correo o IP…" oninput="filterUsers()" style="max-width:320px"></div>'+
      '<div class="scroll-box tall"><table><thead><tr><th>Nombre</th><th>Email</th><th>Verif.</th><th>Plan</th><th>País</th><th>💰 RV</th><th>Última conexión</th></tr></thead><tbody id="users-body"><tr><td colspan="7">Cargando…</td></tr></tbody></table></div>'+
      '<h2 class="sec">✉️ Enviar mensaje</h2>'+
      '<div class="block"><input id="msg-search" class="field" placeholder="🔍 Buscar usuario por nombre, correo o IP…" oninput="filterMsgUsers()">'+
      '<select id="msg-user" class="field"><option value="all">📢 Todos los usuarios</option></select>'+
      '<small id="msg-search-info" style="display:block;color:var(--cocoa-soft);margin:4px 0 8px"></small>'+
      '<input id="msg-title" class="field" placeholder="Título del mensaje" maxlength="120">'+

function showCardDetail(kind){
  var s=statsCache||{};
  var users=usersCache||[];
  var title="", body="";
  if(kind==="total"){
    var ver=users.filter(function(u){return u.emailVerificado;}).length;
    var mut=users.filter(function(u){return u.chatMuted;}).length;
    var ban=(bannedCache||[]).length;
    title="👥 Usuarios registrados";
    body=kv("Total", "<b>"+s.totalUsers+"</b>")+
      kv("Correos verificados", ver)+kv("Sin verificar", users.length-ver)+
      kv("Con chat deshabilitado", mut)+kv("Baneados", ban)+
      '<p style="font-size:.8rem;color:var(--cocoa-soft);margin-top:8px">Toca cualquier fila de la tabla de usuarios para ver su detalle completo.</p>';
  }else if(kind==="plan"){
    var con=users.filter(function(u){return u.conPlan;});
    title="💳 Usuarios con plan pagado";
    body=kv("Total con plan", "<b>"+con.length+"</b>")+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (con.map(userLine).join("")||'<p style="color:var(--cocoa-soft)">Sin usuarios con plan aún.</p>')+'</div>';
  }else if(kind==="trial"){
    var sin=users.filter(function(u){return !u.conPlan;});
    title="🆓 Usuarios en prueba / sin plan";
    body=kv("Total sin plan", "<b>"+sin.length+"</b>")+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (sin.map(userLine).join("")||'<p style="color:var(--cocoa-soft)">Todos tienen plan. 🎉</p>')+'</div>';
  }else if(kind==="online"){
    var on=users.filter(function(u){return u.enLinea;});
    title="🟢 Conectados ahora";
    body=kv("En línea (últimos 5 min)", "<b>"+on.length+"</b>")+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (on.map(function(u){
        return '<div class="rowline"><span>🟢 '+esc(u.nombre)+' <small style="color:var(--cocoa-soft)">'+esc(u.email)+'</small></span><span style="font-size:.8rem;color:var(--cocoa-soft)">'+esc(u.ultimaConexion||"")+'</span></div>';
      }).join("")||'<p style="color:var(--cocoa-soft)">Nadie conectado ahora mismo.</p>')+'</div>';
  }else if(kind==="today"){
    var hoy=new Date().toISOString().slice(0,10);
    var reg=users.filter(function(u){return (u.registradoRaw||"").slice(0,10)===hoy;});
    title="📝 Registros de hoy";
    body=kv("Nuevos hoy", "<b>"+reg.length+"</b>")+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (reg.map(function(u){
        return '<div class="rowline"><span>'+esc(u.nombre)+' <small style="color:var(--cocoa-soft)">'+esc(u.email)+'</small></span><span style="font-size:.8rem;color:var(--cocoa-soft)">'+esc(u.registrado||"")+'</span></div>';
      }).join("")||'<p style="color:var(--cocoa-soft)">Sin registros hoy todavía.</p>')+'</div>';
  }else if(kind==="mrr"){
    var mens=users.filter(function(u){return u.conPlan&&(u.planDetalle==="monthly"||/mes/i.test(u.plan||""));}).length;
    var anu=users.filter(function(u){return u.conPlan&&(u.planDetalle==="yearly"||u.planDetalle==="annual"||/año/i.test(u.plan||""));}).length;
    var otros=users.filter(function(u){return u.conPlan;}).length-mens-anu;
    title="💰 MRR estimado";
    body=kv("MRR total", "<b>$"+(s.mrr||0)+"</b>")+
      kv("Planes mensuales ($4.99)", mens+" → $"+(mens*4.99).toFixed(2))+
      kv("Planes anuales ($39.99/año)", anu+" → $"+(anu*39.99/12).toFixed(2)+"/mes")+
      (otros>0?kv("Otros planes", otros):"")+
      kv("Suscripciones activas", s.activeSubscriptions!=null?s.activeSubscriptions:"—")+
      '<p style="font-size:.8rem;color:var(--cocoa-soft);margin-top:8px">Estimación: mensual $4.99 · anual $39.99/12 por mes.</p>';
  }else if(kind==="countries"){
    var tops=s.topCountries||[];
    title="🌍 Países";
    body=kv("Países distintos", "<b>"+(s.countriesCount||0)+"</b>")+
      '<div style="margin-top:8px">'+tops.map(function(c,i){
        return '<div class="rowline"><span>'+(i+1)+'. '+flagEmoji(c.codigo)+' <b>'+esc(c.pais)+'</b></span><span>'+c.usuarios+' usuario'+(c.usuarios===1?"":"s")+'</span></div>';
      }).join("")+'</div>';
  }else if(kind==="referrals"){
    var tops=s.topReferrers||[];
    title="📤 Llegaron por referido";
    body=kv("Total por referido", "<b>"+(s.referredUsers||0)+"</b>")+
      '<h4 style="margin-top:10px">🏆 Top invitadores</h4>'+
      (tops.map(function(r,i){
        return '<div class="rowline"><span>'+(i+1)+'. '+esc(r.nombre)+'</span><span>'+r.referidos+' referido'+(r.referidos===1?"":"s")+'</span></div>';
      }).join("")||'<p style="color:var(--cocoa-soft)">Aún no hay referidos.</p>');
  }else if(kind==="chat"){
    var mut=users.filter(function(u){return u.chatMuted;});
    title="🚩 Chats deshabilitados";
    body=kv("Total", "<b>"+(s.mutedChats||0)+"</b>")+
      kv("Por anti-spam (3 strikes)", mut.length)+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (users.filter(function(u){return u.chatMuted;}).map(function(u){
        return '<div class="rowline clickable" onclick="closeDetailModal();showUser('+u.id+')"><span>🚩 '+esc(u.nombre)+' <small style="color:var(--cocoa-soft)">'+esc(u.email)+'</small></span><span class="badge">ver</span></div>';
      }).join("")||'<p style="color:var(--cocoa-soft)">Ningún chat deshabilitado. 🎉</p>')+'</div>';
  }else if(kind==="flag"){
    title="🚩 Usuarios con banderas";
    body=kv("Con banderas", "<b>"+(s.flaggedUsers||0)+"</b>")+
      kv("🔴 Rojas pendientes", "<b>"+(s.redFlags||0)+"</b>")+
      '<div style="margin-top:10px"><button class="btn btn-sm" onclick="closeDetailModal();loadFlagged()">Ver banderas rojas pendientes</button></div>'+
      '<p style="font-size:.8rem;color:var(--cocoa-soft);margin-top:8px">Toca un usuario en la tabla para ponerle o quitarle banderas desde su perfil.</p>';
  }else if(kind==="cancel"){
    var canc=users.filter(function(u){return u.estadoSuscripcion==="CANCELLED";});
    title="❌ Planes cancelados";
    body=kv("Total cancelados", "<b>"+(s.cancelledPlans||0)+"</b>")+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (canc.map(function(u){
        return '<div class="rowline clickable" onclick="closeDetailModal();showUser('+u.id+')"><span>❌ '+esc(u.nombre)+' <small style="color:var(--cocoa-soft)">'+esc(u.email)+'</small></span><span class="badge">ver</span></div>';
      }).join("")||'<p style="color:var(--cocoa-soft)">Sin cancelaciones. 🎉</p>')+'</div>';
  }else if(kind==="rvcirc"){
    title="💰 RV en circulación";
    body=kv("RV en manos de usuarios", "<b>"+(s.rvCirculacion||0)+" RV</b>")+
      '<div style="max-height:300px;overflow-y:auto;margin-top:8px">'+
      (users.slice().sort(function(a,b){return (b.rv||0)-(a.rv||0);}).slice(0,15).map(function(u){
        return '<div class="rowline clickable" onclick="closeDetailModal();showUser('+u.id+')"><span>'+esc(u.nombre)+' <small style="color:var(--cocoa-soft)">'+esc(u.email)+'</small></span><span><b>'+(u.rv||0)+' RV</b></span></div>';
      }).join("")||'<p style="color:var(--cocoa-soft)">Sin usuarios.</p>')+'</div>'+
      '<p style="font-size:.8rem;color:var(--cocoa-soft);margin-top:8px">Los RV circulando son gasto futuro dentro de la app (links y fotos del chat).</p>';
  }else if(kind==="rving"){
    title="🛒 Ingresos por RV";
    body=kv("Ingresos totales por recargas", "<b>$"+(s.ingresosRV||0)+"</b>")+
      kv("RV vendidos", "<b>"+(s.rvVendidos||0)+" RV</b>")+
      '<p style="font-size:.8rem;color:var(--cocoa-soft);margin-top:8px">Packs: $12 = 120 RV · $25 = 300 RV · $50 = 700 RV (vía PayPal). No incluye los bonos de planes.</p>';
  }
  showDetailModal(title, body, [{label:"Cerrar", cls:"btn-ghost", onClick:closeDetailModal}]);
}

async function loadBlockedIps(){

async function blockIpManual(){
  var ip = ($("#block-ip").value||"").trim();
  var reason = ($("#block-reason").value||"").trim() || "Bloqueo manual";
  if(!ip){ alert("Escribe una IP."); return; }
  try{ await api("POST","/api/admin/blocked-ips",{ip:ip,reason:reason}); $("#block-ip").value=""; $("#block-reason").value=""; loadBlockedIps(); }
  catch(e){ alert("Error: "+e.message); }
}
async function unblockIp(ip){
  if(!confirm("¿Desbloquear "+ip+"?")) return;
  try{ await api("DELETE","/api/admin/blocked-ips/"+encodeURIComponent(ip)); loadBlockedIps(); }
  catch(e){ alert("Error: "+e.message); }
}

  var view=($("#growth-view")||{}).value||"fecha";
  var head=$("#growth-head");
  try{
    if(view==="pais"||view==="ciudad"){

      var rows=(view==="pais"?g.paises:g.ciudades)||[];
      growthCache=rows.map(function(r){
        return {
          etiqueta: view==="pais" ? (flagEmoji(r.codigo)+" "+r.pais) : (r.ciudad+" · "+r.pais),
          nuevosUsuarios: r.nuevosUsuarios||0,
          nuevosConPlan: r.nuevosConPlan||0

      });
      if(head) head.innerHTML='<th>'+(view==="pais"?"🌍 País":"🏙️ Ciudad")+'</th><th>Nuevos usuarios</th><th>Nuevos con plan</th>';
    }else{

      growthCache=g2.periods||[];

    $("#growth-chart").innerHTML=growthCache.map(function(p,idx){
      var h=Math.max(4,Math.round((p.nuevosUsuarios||0)/max*110));
      return '<div class="bar'+(p.nuevosConPlan>0?' plan':'')+'" style="height:'+h+'px;cursor:pointer" data-tip="'+esc(p.etiqueta)+': '+(p.nuevosUsuarios||0)+' usuarios — clic para detalles" onclick="showGrowthDetail('+idx+')"></div>';
    }).join("");

      return '<tr class="clickable" onclick="showGrowthDetail('+idx+')" title="Ver detalles"><td>'+esc(p.etiqueta)+'</td><td>'+(p.nuevosUsuarios||0)+'</td><td>'+(p.nuevosConPlan||0)+'</td></tr>';

/* Copia el link de verificación manual (cuando el correo automático no está configurado). */
function copyVerifyLink(link){
  var done=function(){ var m=$("#copy-msg"); if(m) m.textContent="¡Copiado! 📋"; };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(done).catch(function(){ fallbackCopy(link); done(); });
  }else{ fallbackCopy(link); done(); }
}
function fallbackCopy(text){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* ---------- Link Pub ---------- */
var lpData={links:[],countries:[]};
var lpSelectedUsers={}; // id -> {nombre,email}

function lpPlatform(url){
  var host=""; try{ host=new URL(url).hostname.replace(/^www\./,"").toLowerCase(); }catch(e){}
  var map=[
    [["youtube.com","youtu.be"],"youtube","YouTube"],
    [["facebook.com","fb.com","fb.watch"],"facebook","Facebook"],
    [["instagram.com"],"instagram","Instagram"],
    [["tiktok.com"],"tiktok","TikTok"],
    [["x.com","twitter.com"],"x","X"],
    [["whatsapp.com","wa.me"],"whatsapp","WhatsApp"],
    [["t.me","telegram.org"],"telegram","Telegram"],
    [["open.spotify.com","spotify.com"],"spotify","Spotify"],
    [["twitch.tv"],"twitch","Twitch"],
    [["pinterest.com"],"pinterest","Pinterest"],
    [["linkedin.com"],"linkedin","LinkedIn"]
  ];
  for(var i=0;i<map.length;i++){
    var m=map[i];
    for(var j=0;j<m[0].length;j++){ var h=m[0][j]; if(host===h||host.slice(-(h.length+1))==="."+h) return {slug:m[1],name:m[2],host:host}; }
  }
  return {slug:null,name:host||"Enlace",host:host};
}
function lpTargetSummary(l){
  var parts=[];
  parts.push(l.target_users&&l.target_users.length?("👤 "+l.target_users.length+" usuario(s)"):"🌍 Todos los usuarios");
  if(l.target_countries&&l.target_countries.length) parts.push("🏳️ "+l.target_countries.join(", "));
  if(l.target_gender==="M") parts.push("👨 Solo hombres");
  if(l.target_gender==="F") parts.push("👩 Solo mujeres");
  return parts.join(" · ");
}

async function loadLinkPub(){
  var box=$("#linkpub"); if(!box) return;
  try{
    lpData=await api("GET","/api/admin/links");
    var countries=(lpData.countries||[]).map(function(c){
      return '<label style="display:inline-flex;align-items:center;gap:4px;margin:0 10px 6px 0;font-size:.88rem"><input type="checkbox" class="lp-country" value="'+esc(c)+'"> '+esc(c)+'</label>';
    }).join("");
    box.innerHTML=
      '<input id="lp-url" class="field" placeholder="Link (https://youtube.com/@tucanal, tu blog…)" style="margin-bottom:8px">'+
      '<input id="lp-title" class="field" placeholder="Título (opcional: si lo dejas vacío se usa el nombre de la plataforma)" style="margin-bottom:10px">'+
      '<div style="margin-bottom:8px;font-size:.9rem"><b>¿Para quién?</b><br>'+
      '<label style="margin-right:16px"><input type="radio" name="lp-aud" value="all" checked onchange="lpAudToggle()"> 🌍 Todos los usuarios</label>'+
      '<label><input type="radio" name="lp-aud" value="users" onchange="lpAudToggle()"> 👤 Usuarios específicos</label></div>'+
      '<div id="lp-users-box" style="display:none;margin-bottom:10px">'+
        '<input id="lp-user-search" class="field" placeholder="🔎 Buscar usuario por nombre o correo…" oninput="lpRenderUserResults()">'+
        '<div id="lp-user-results" style="max-height:180px;overflow-y:auto;margin-top:6px"></div>'+
        '<div id="lp-user-selected" style="margin-top:6px"></div>'+
      '</div>'+
      '<div style="margin-bottom:8px;font-size:.9rem"><b>Países</b> <span style="color:var(--cocoa-soft)">(solo países con usuarios registrados)</span><br>'+
      '<label style="margin-right:12px"><input type="checkbox" id="lp-all-countries" checked onchange="lpCountriesToggle()"> Todos los países</label>'+
      '<span id="lp-countries-box" style="display:none">'+(countries||'<span style="color:var(--cocoa-soft)">Sin países registrados aún.</span>')+'</span></div>'+
      '<div style="margin-bottom:12px;font-size:.9rem"><b>Sexo</b><br>'+
      '<select id="lp-gender" class="field" style="max-width:240px"><option value="">👥 Todos</option><option value="M">👨 Solo hombres (M)</option><option value="F">👩 Solo mujeres (F)</option></select></div>'+
      '<button class="btn" onclick="publishLinkPub()">📤 Publicar link</button> <span id="lp-msg" style="font-size:.88rem"></span>'+
      '<div id="lp-list" class="scroll-box small" style="margin-top:16px"></div>';
    lpRenderList();
  }catch(e){ if(e.message==="AUTH") authFail(); else box.innerHTML='<div class="err">Error cargando Link Pub: '+esc(e.message)+'</div>'; }
}
function lpAudToggle(){
  var v=document.querySelector('input[name="lp-aud"]:checked').value;
  $("#lp-users-box").style.display = v==="users" ? "" : "none";
  if(v==="users") lpRenderUserResults();
}
function lpCountriesToggle(){
  $("#lp-countries-box").style.display = $("#lp-all-countries").checked ? "none" : "";
}
function lpRenderUserResults(){
  var q=($("#lp-user-search").value||"").toLowerCase();
  var res=(usersCache||[]).filter(function(u){
    return !q || (u.nombre||"").toLowerCase().indexOf(q)>=0 || (u.email||"").toLowerCase().indexOf(q)>=0;
  }).slice(0,30);
  $("#lp-user-results").innerHTML=res.map(function(u){
    var on=!!lpSelectedUsers[u.id];
    return '<div class="rowline"><span>'+esc(u.nombre||"—")+' <small style="color:var(--cocoa-soft)">'+esc(u.email||"")+'</small></span>'+
      '<button class="btn btn-sm" onclick="lpToggleUser('+u.id+')">'+(on?"✓ Quitar":"+ Agregar")+'</button></div>';
  }).join("")||'<p style="color:var(--cocoa-soft);font-size:.85rem">Sin resultados.</p>';
  lpRenderSelectedUsers();
}
function lpRenderSelectedUsers(){
  var ids=Object.keys(lpSelectedUsers);
  $("#lp-user-selected").innerHTML=ids.length
    ? '<div style="font-size:.85rem"><b>Seleccionados ('+ids.length+'):</b> '+ids.map(function(id){ return esc(lpSelectedUsers[id].nombre); }).join(", ")+'</div>'
    : '<div style="font-size:.85rem;color:var(--cocoa-soft)">Ningún usuario seleccionado todavía.</div>';
}
function lpToggleUser(id){
  if(lpSelectedUsers[id]) delete lpSelectedUsers[id];
  else{ var u=(usersCache||[]).find(function(x){ return x.id===id; }); if(u) lpSelectedUsers[id]={nombre:u.nombre||u.email||("Usuario "+id), email:u.email||""}; }
  lpRenderUserResults();
}
async function publishLinkPub(){
  var url=($("#lp-url").value||"").trim();
  var msg=$("#lp-msg");
  if(!/^https?:\/\//i.test(url)){ msg.style.color="#a33"; msg.textContent="⚠️ El link debe empezar con http:// o https://"; return; }
  var aud=document.querySelector('input[name="lp-aud"]:checked').value;
  var userIds = aud==="users" ? Object.keys(lpSelectedUsers).map(Number) : [];
  if(aud==="users" && !userIds.length){ msg.style.color="#a33"; msg.textContent="⚠️ Elige al menos un usuario."; return; }
  var countries=[];
  if(!$("#lp-all-countries").checked){
    countries=Array.prototype.map.call(document.querySelectorAll(".lp-country:checked"), function(c){ return c.value; });
  }
  var body={ url:url, title:($("#lp-title").value||"").trim(), userIds:userIds, countries:countries, gender:$("#lp-gender").value };
  try{
    await api("POST","/api/admin/links",body);
    msg.style.color="#2e7d32"; msg.textContent="✅ ¡Link publicado!";
    lpSelectedUsers={};
    loadLinkPub();
  }catch(e){ if(e.message==="AUTH") authFail(); else { msg.style.color="#a33"; msg.textContent="Error: "+e.message; } }
}
function lpRenderList(){
  var list=$("#lp-list"); if(!list) return;
  var links=lpData.links||[];
  if(!links.length){ list.innerHTML='<p style="color:var(--cocoa-soft);font-size:.9rem">No hay links publicados todavía.</p>'; return; }
  list.innerHTML='<div style="font-size:.9rem;margin-bottom:6px"><b>Publicados ('+links.length+')</b></div>'+links.map(function(l){
    var p=lpPlatform(l.url);
    var ico=p.slug?'<img src="https://cdn.simpleicons.org/'+p.slug+'" alt="" style="width:22px;height:22px;vertical-align:-5px" onerror="this.remove()"> ':"🔗 ";
    return '<div class="rowline"><span>'+ico+'<b>'+esc(l.title||p.name)+'</b> <small style="color:var(--cocoa-soft)">'+esc(l.url)+'</small><br><small style="color:var(--cocoa-soft)">'+esc(lpTargetSummary(l))+'</small></span>'+
      '<button class="btn btn-sm" onclick="deleteLinkPub('+l.id+')">🗑️ Quitar</button></div>';
  }).join("");
}
async function deleteLinkPub(id){
  if(!confirm("¿Quitar este link de los perfiles?")) return;
  try{ await api("DELETE","/api/admin/links/"+id); loadLinkPub(); }
  catch(e){ if(e.message==="AUTH") authFail(); else alert("Error: "+e.message); }
}

/* ---------- contenido del programa (audios y preguntas de test) ---------- */
async function loadProgramContent(){
  try{
    var d=await api("GET","/api/admin/program-audios");
    var box=$("#pa-list");
    if(box){
      box.innerHTML=(d.audios||[]).map(function(a){
        return '<div class="rowline"><span>🎧 Día '+a.day+' · '+(a.gender==="F"?"👩 Mujer":"👨 Hombre")+' <small style="color:var(--cocoa-soft)">'+a.kb+' KB'+(a.actualizado?' · '+esc(a.actualizado):'')+'</small></span><button class="btn btn-danger btn-sm" onclick="delProgramAudio('+a.day+',\''+a.gender+'\')">🗑️ Quitar</button></div>';
      }).join("")||'<p style="color:var(--cocoa-soft);font-size:.85rem">Sin audios personalizados: se usan los originales.</p>';
    }
  }catch(e){ /* la sección simplemente queda vacía */ }
  try{
    var q=await api("GET","/api/admin/program-questions");
    var qb=$("#pq-list");
    if(qb){
      qb.innerHTML=(q.preguntas||[]).map(function(p){
        return '<div class="rowline"><span>'+(p.kind==="open"?"✍️":"🔢")+' '+esc(p.question)+'</span><button class="btn btn-danger btn-sm" onclick="delProgramQuestion('+p.id+')">🗑️</button></div>';
      }).join("")||'<p style="color:var(--cocoa-soft);font-size:.85rem">Sin preguntas extra.</p>';
    }
  }catch(e){ /* idem */ }
}
function uploadProgramAudio(){
  var f=$("#pa-file"), msg=$("#pa-msg");
  if(!f || !f.files || !f.files[0]){ msg.textContent="Elige un archivo MP3 primero."; return; }
  var file=f.files[0];
  if(file.size > 6*1024*1024){ msg.textContent="⚠️ El MP3 pesa más de 6 MB."; return; }
  var day=$("#pa-day").value, gender=$("#pa-gender").value;
  var rd=new FileReader();
  rd.onload=async function(){
    msg.textContent="Subiendo…";
    try{
      await api("POST","/api/admin/program-audios",{day:Number(day),gender:gender,audio:rd.result});
      msg.textContent="✅ Audio guardado para el día "+day+" ("+(gender==="F"?"mujer":"hombre")+").";
      loadProgramContent();
    }catch(e){ msg.textContent="❌ "+((e.data&&e.data.error)||"Error al subir."); }
  };
  rd.readAsDataURL(file);
}
async function delProgramAudio(day, gender){
  if(!confirm("¿Quitar el audio personalizado del día "+day+"? Volverá el original.")) return;
  try{ await api("DELETE","/api/admin/program-audios/"+day+"/"+gender); loadProgramContent(); }
  catch(e){ if(e.message==="AUTH") authFail(); }
}
async function addProgramQuestion(){
  var t=$("#pq-text").value.trim();
  if(t.length<8){ alert("Escribe una pregunta un poco más completa."); return; }
  try{
    await api("POST","/api/admin/program-questions",{question:t,kind:$("#pq-kind").value});
    $("#pq-text").value="";
    loadProgramContent();
  }catch(e){ alert((e.data&&e.data.error)||"Error al agregar."); }
}
async function delProgramQuestion(id){
  if(!confirm("¿Quitar esta pregunta de los tests?")) return;
  try{ await api("DELETE","/api/admin/program-questions/"+id); loadProgramContent(); }
  catch(e){ if(e.message==="AUTH") authFail(); }
}
